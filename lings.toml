# -----------------------------------------------------------------------------
#  cherenkov-lings - CURRICULUM MANIFEST (single source of truth)
#
#  This file is the ONE authoritative definition of every track and every drill.
#  It is consumed by:
#    * the Rust engine     - src/config.rs at runtime, and src/gamification.rs
#                            as a compile-time fallback via include_str!
#    * the FastAPI backend - crucible/backend/curriculum.py -> GET /api/curriculum
#
#  Adding a track or a drill means editing THIS FILE ONLY. Curriculum data must
#  not be hardcoded anywhere else; tests/curriculum_manifest_tests.rs enforces
#  that this manifest stays in sync with what is actually on disk.
# -----------------------------------------------------------------------------

[platform]
name = "cherenkov-lings"
version = "1.0.0"
sandbox_port = 8080
chaos_proxy_port = 8086
telemetry = false

[evaluation]
pass_threshold = 85.0
flakiness_iterations = 5
flakiness_timeout_ms = 5000
chaos_latency_ms = 200
chaos_jitter_ms = 75

[ui]
theme = "cherenkov-blue"
show_hints_on_failure = true
enable_audio_bell = false
language = "en"

# -----------------------------------------------------------------------------
#  Automation Foundations (Manual QA On-Ramp) - Python / Pytest
# -----------------------------------------------------------------------------
[[tracks]]
id = "foundations"
name = "Automation Foundations — Manual QA On-Ramp (Python / Pytest)"
display_name = "Automation Foundations (Manual QA On-Ramp)"
runner = "python"
exercise_dir = "exercises/00_foundations"
extension = ".py"
command = "python -m pytest {file} --json-report --json-report-file=report.json"
stack = "Python / Pytest"
tier = "Tier 1 — Beginner"
description = "Core mental model: AAA pattern, assertions, test naming, and avoiding mock traps."

  [[tracks.drills]]
  id = "01_what_is_a_test"
  name = "What is an Automated Test?"

  [[tracks.drills]]
  id = "02_test_naming_matters"
  name = "Test Naming as Living Documentation"

  [[tracks.drills]]
  id = "03_arrange_act_assert"
  name = "The Universal AAA Pattern"

  [[tracks.drills]]
  id = "04_dont_test_the_mock"
  name = "Do Not Test the Mock"

  [[tracks.drills]]
  id = "05_one_thing_per_test"
  name = "Single Responsibility in Test Cases"


# Drill 01: Biometric Fallback - Solution
# Uses runFlow with a conditional when: clause to handle biometric failure gracefully
# Tests web-based auth flow with fallback pattern
---
- openLink: http://10.0.2.2:8080/mobile-test
- tapOn:
    id: login-biometric
- runFlow:
    when:
      visible:
        text: Biometric unavailable
    commands:
      - tapOn:
          id: pin-input
      - inputText: "1234"
      - tapOn:
          id: pin-submit
- assertVisible:
    text: Welcome, SDET Engineer

# PRODUCTION STORY:
# WhatsApp Android Orientation Memory Leak & State Loss (2021)
# When users rotated their screens while composing multi-part messages, the Android OS destroyed and recreated
# the activity, clearing un-persisted text input buffers and triggering out-of-memory crashes on low-end devices.

# Drill 03: Activity Recreation on Screen Rotation
# Anti-pattern: Asserts state before rotation, never re-asserts after activity recreation
# TODO: Trigger a screen rotation and re-assert that the UI state is preserved
---
- launchApp:
    appId: com.cherenkov.bankapp
- tapOn:
    text: View Balance
- assertVisible:
    text: "Account Balance: USD 1000"
# Missing: rotate the screen and re-assert after activity recreation
# On rotation, Android destroys and recreates the Activity -- state can be lost

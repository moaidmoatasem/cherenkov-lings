# Drill 03: Activity Recreation on Screen Rotation - Solution
# Tests state preservation across page reload (simulates activity recreation)
---
- openLink: http://10.0.2.2:8080/mobile-test
- tapOn:
    id: view-balance
- assertVisible:
    text: "Account Balance: USD 1000"
- setOrientation:
    orientation: landscape
- assertVisible:
    text: "Account Balance: USD 1000"
    optional: false
- setOrientation:
    orientation: portrait
- assertVisible:
    text: "Account Balance: USD 1000"

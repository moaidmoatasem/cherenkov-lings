# PRODUCTION STORY:
# Slack iOS 14 Notification Permission Deadlock (2020)
# A major mobile release introduced asynchronous system notification prompts on initial launch.
# Automated regression tests on cloud device farms locked up because the unexpected OS modal
# obscured app login buttons, causing CI test timeouts across 50 device models.

# Drill 05: Push Notification System Permission Handling (Broken Anti-Pattern)

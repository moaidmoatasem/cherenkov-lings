# SDET Resilient Pattern: Dynamic Scroll Until Element Visible
# Uses Maestro's scrollUntilVisible command to handle varying screen heights,
# lazy-loading lists, and dynamic recycler views across Android & iOS devices.
---
- openLink: http://10.0.2.2:8080/mobile-test
- tapOn:
    id: view-products
- scrollUntilVisible:
    element:
      id: btn-checkout
    direction: DOWN
    maxRetries: 5
- tapOn:
    id: btn-checkout
- assertVisible:
    text: Order Confirmed

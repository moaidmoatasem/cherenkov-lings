# Green on CI, broken for half the team: this suite only ever runs on one
# runner and one Node version.
#
# TASK: give the test job real parallel coverage across OS and runtime.

name: E-Commerce Regression Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: Playwright E2E Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run Playwright suite
        run: npx playwright test --reporter=json
        env:
          CRUCIBLE_TOKEN: ${{ secrets.CRUCIBLE_TOKEN }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

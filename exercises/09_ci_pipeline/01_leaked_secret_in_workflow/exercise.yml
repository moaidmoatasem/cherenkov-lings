# The suite authenticates against the Micro-Crucible, and someone got it
# working the fast way. `pipeline validate` refuses to let this merge.
#
# TASK: make this workflow score 100/100 without breaking authentication.

name: E-Commerce Regression Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: Playwright E2E Suite
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Run Playwright suite
        run: npx playwright test --reporter=json
        env:
          CRUCIBLE_TOKEN: "ghp_C4f81a2Kx9QwErTyUiOpAsDfGhJkLzXcVbNm"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

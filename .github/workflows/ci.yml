name: Cherenkov-lings CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  rust_engine_and_audit:
    name: Rust Engine & Curriculum Audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # The windows leg is the only place several of these tests run at all, and
      # a fail-fast matrix cancelled it the moment ubuntu failed -- so a
      # Linux-only breakage silently blinded the platform whose flakes we were
      # chasing. Let both legs finish and report.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Check Formatting
      run: cargo fmt --all -- --check

    - name: Clippy Lints
      run: cargo clippy --all-targets -- -D warnings

    - name: Run Full Rust Test Suite
      run: cargo test

    - name: Run 100% Curriculum Integrity Audit
      run: cargo run -- audit

  crucible_backend_tests:
    name: Micro-Crucible Backend & Chaos Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # This job is a Python job that also compiles the Rust crate: scenarios 9
    # and 10 of the empirical adversarial suite shell out to `cargo run -- audit`,
    # `cargo run -- dashboard`, `cargo run -- diagnose` and `cargo test`. Without
    # these two steps that compile was unpinned and uncached -- it took whatever
    # rustc the runner image happened to ship (the crate is edition 2024, so it
    # needs >= 1.85 and would break on an image that rolled backwards) and it
    # rebuilt all 195 dependencies from scratch on every single push.
    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    # Keyed per job, so this does not collide with the cache rust_engine_and_audit
    # keeps for its own matrix legs. The two jobs run in parallel and cannot share
    # a warm target/ within one run anyway; what this buys is that the dependency
    # graph is restored rather than recompiled on every run after the first.
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    # Building here rather than letting pytest trigger it inside a subprocess is
    # worth a step of its own: the suite captures cargo's output and only prints
    # it on failure, so a crate that does not compile used to surface as a bare
    # "[FAIL] Scenario 9" with the compiler errors buried in captured stdout.
    # This is not extra compilation -- it is the same target/ the suite then
    # reuses -- and it puts the build's cost on the timeline where it can be read.
    - name: Prebuild Rust Engine (used by empirical scenarios 9 & 10)
      run: |
        cargo build
        cargo test --no-run

    - name: Install Dependencies
      run: |
        pip install -r crucible/backend/requirements.txt
        # Every version below carries a ceiling on purpose. An unpinned ruff
        # changes rule sets between releases, so the same commit lints clean one
        # day and fails the next; the identical drift walked starlette onto a
        # TestClient that wants httpx2 instead of httpx. And httpx is declared
        # nowhere else in the tree even though every suite in this job imports
        # TestClient, so collection died before a single test ran.
        # requests joins them because this job runs the empirical adversarial
        # suite, which drives verify_all_exercises.py over 00_foundations, and
        # drills 04 and 05 import requests to call the live Crucible.
        # pact-python mirrors the same floor python_exercise_validation installs
        # for the contract-pact track, so this job stays able to run those
        # solutions too if the adversarial suite's scope ever grows into them.
        pip install ruff==0.15.12 'pytest>=8,<10' 'pytest-asyncio>=0.23,<2' 'pytest-json-report>=1.5,<2' 'httpx>=0.27,<1.0' 'requests>=2.31,<3' 'pact-python>=3.4,<4'

    - name: Lint Backend Code
      run: ruff check crucible/ tests/

    - name: Run Chaos & Pathology Pytest Suite
      run: python -m pytest tests/test_micro_crucible_chaos.py -v

    # The empirical adversarial suite verifies every 00_foundations drill, and
    # 04_dont_test_the_mock / 05_one_thing_per_test hit the real Crucible on
    # :8081 rather than a fake -- that is the lesson in drill 04. Without the
    # backend up they fail to connect, so the suite could never reach 10/10.
    # Same rationale as python_exercise_validation, which already does this.
    - name: Start Micro-Crucible Backend
      # NOTE: keep `exit 1` off the start of its own line. src/pipeline/runner.rs
      # simulates a bare `exit 1` as a deliberately-failing step, and
      # tests/pipeline_tests.rs runs this very file through that simulator and
      # asserts it comes out green. `... && exit 1` is not matched by that heuristic.
      run: |
        nohup python -m uvicorn crucible.backend.app:app --host 127.0.0.1 --port 8081 > /tmp/crucible-backend.log 2>&1 &
        for i in $(seq 1 30); do
          curl -sf http://127.0.0.1:8081/health > /dev/null && echo "Crucible backend healthy after ${i}s" && exit 0
          sleep 1
        done
        cat /tmp/crucible-backend.log >&2
        echo "Crucible backend did not become healthy within 30s" >&2 && exit 1

    # The Sprint 4 API and fuzz suites live under crucible/backend/tests and
    # were never invoked by CI, so /api/review, /api/pipeline, /api/reports and
    # /api/triage went unguarded on every push.
    - name: Run Backend API & Adversarial Fuzz Suites
      run: python -m pytest crucible/backend/tests tests/test_adversarial_solver_empirical.py -v

  frontend_build_verification:
    name: React Frontend Build & Type Safety
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        # Playwright 1.62 refuses to run on Node 18 ("requires Node.js 20 or
        # higher"), which failed this workflow's e2e job on every run.
        node-version: '20'

    - name: Install & Build Frontend
      run: |
        cd crucible/frontend
        npm ci
        npx tsc --noEmit
        npm run build

    # Typechecks the Playwright specs, which neither tsconfig covered before.
    - name: Typecheck Specs
      run: |
        npm ci
        npx tsc --noEmit

  learn_ui_e2e:
    name: Learn UI End-to-End (Playwright)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        # Playwright 1.62 refuses to run on Node 18 ("requires Node.js 20 or
        # higher"), which failed this workflow's e2e job on every run.
        node-version: '20'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Backend
      run: pip install -r crucible/backend/requirements.txt

    - name: Start Backend
      run: |
        python -m uvicorn crucible.backend.app:app --host 127.0.0.1 --port 8081 &
        for i in $(seq 1 30); do
          curl -sf http://127.0.0.1:8081/health && break
          sleep 1
        done

    - name: Build & Serve Frontend
      run: |
        cd crucible/frontend
        npm ci
        npm run build
        npx vite preview --port 8080 --host 127.0.0.1 &
        cd -
        for i in $(seq 1 30); do
          curl -sf http://127.0.0.1:8080/ && break
          sleep 1
        done

    - name: Run Learn E2E Suite
      run: |
        npm ci
        npx playwright install --with-deps chromium
        npx playwright test crucible/frontend/e2e

  python_exercise_validation:
    name: Python Exercise Validation (5 tracks, 18 drills)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        # The devsecops and contract-pact solutions import the crucible backend
        # and drive it through fastapi's TestClient, which needs httpx; the
        # foundations and tool-decisions solutions import requests.
        # pact-python is the contract-pact track's own dependency: its
        # solutions build real Pact/Verifier objects against pact-python-ffi
        # (a compiled binary, hence the ceiling -- an unpinned major bump can
        # change the Pact/Verifier surface out from under these drills; v1/v2
        # used Consumer/Provider classes that v3's FFI-based API replaced).
        pip install -r crucible/backend/requirements.txt
        pip install 'pytest>=8,<10' 'pytest-json-report>=1.5,<2' 'requests>=2.31,<3' 'httpx>=0.27,<1.0' 'pact-python>=3.4,<4'

    # Several drills call the live Crucible on :8081 rather than a fake — that is
    # the lesson in 00_foundations/04_dont_test_the_mock, and 05_one_thing_per_test,
    # 07_cloud_devsecops and 08_tool_decisions do the same. Without the backend
    # running these fail with ConnectionRefusedError, which is what broke this job.
    - name: Start Micro-Crucible Backend
      # NOTE: keep `exit 1` off the start of its own line. src/pipeline/runner.rs
      # simulates a bare `exit 1` as a deliberately-failing step, and
      # tests/pipeline_tests.rs runs this very file through that simulator and
      # asserts it comes out green. `... && exit 1` is not matched by that heuristic.
      run: |
        nohup python -m uvicorn crucible.backend.app:app           --host 127.0.0.1 --port 8081 > /tmp/crucible-backend.log 2>&1 &
        for i in $(seq 1 30); do
          curl -sf http://127.0.0.1:8081/health > /dev/null && echo "Crucible backend healthy after ${i}s" && exit 0
          sleep 1
        done
        cat /tmp/crucible-backend.log >&2
        echo "Crucible backend did not become healthy within 30s" >&2 && exit 1

    - name: Validate Foundations Track (5 drills)
      run: |
        for dir in exercises/00_foundations/*/; do
          if [ -f "$dir/solution.py" ]; then
            echo "Testing: $dir"
            python -m pytest "$dir/solution.py" -v --tb=short || exit 1
          fi
        done

    - name: Validate DevSecOps Track (5 drills)
      run: |
        for dir in exercises/07_cloud_devsecops/*/; do
          if [ -f "$dir/solution.py" ]; then
            echo "Testing: $dir"
            python -m pytest "$dir/solution.py" -v --tb=short || exit 1
          fi
        done

    - name: Validate Tool Decisions Track (4 drills)
      run: |
        for dir in exercises/08_tool_decisions/*/; do
          if [ -f "$dir/solution.py" ]; then
            echo "Testing: $dir"
            python -m pytest "$dir/solution.py" -v --tb=short || exit 1
          fi
        done

    - name: Validate Contract Pact Track (3 drills)
      run: |
        for dir in exercises/09_contract_pact/*/; do
          if [ -f "$dir/solution.py" ]; then
            echo "Testing: $dir"
            python -m pytest "$dir/solution.py" -v --tb=short || exit 1
          fi
        done

    - name: Validate API Validation Fundamentals Track (1 drill)
      run: |
        for dir in exercises/02_api_pytest/*/; do
          if [ -f "$dir/solution.py" ]; then
            echo "Testing: $dir"
            python -m pytest "$dir/solution.py" -v --tb=short || exit 1
          fi
        done

  container_images:
    name: Container Images
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Neither image was built anywhere in this workflow, so both Dockerfiles
    # could rot for months without a push noticing. A build is the cheapest
    # gate that catches it. The backend also gets a health probe, because an
    # image that builds and then exits on startup is not much better than one
    # that does not build at all.
    - name: Build Backend Image
      run: docker build -f Dockerfile.backend -t cherenkov-backend:ci .

    - name: Build Frontend Image
      run: docker build -f Dockerfile.frontend -t cherenkov-frontend:ci .

    # NOTE: keep `exit 1` off the start of its own line, for the reason spelled
    # out on the Start Micro-Crucible Backend step above. This step shipped with
    # a bare `exit 1` and turned `test_runner_executes_actual_repo_ci_workflow`
    # red, which -- the matrix being fail-fast -- cancelled the windows leg on
    # every push.
    - name: Smoke the Backend Image
      # NOTE: keep `exit 1` off the start of its own line. src/pipeline/runner.rs
      # simulates a bare `exit 1` as a deliberately-failing step, and
      # tests/pipeline_tests.rs runs this very file through that simulator and
      # asserts it comes out green. `... && exit 1` is not matched by that heuristic.
      run: |
        docker run -d --name crucible -p 8081:8081 cherenkov-backend:ci
        ok=""
        for _ in $(seq 1 30); do
          if curl -sf http://127.0.0.1:8081/health > /dev/null; then
            ok=1
            break
          fi
          sleep 1
        done
        if [ -z "$ok" ]; then
          echo "The backend image never answered /health. Container log follows:"
          docker logs crucible
          docker rm -f crucible
          echo "backend image failed its health probe" >&2 && exit 1
        fi
        docker rm -f crucible

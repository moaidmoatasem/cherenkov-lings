[package]
name = "cherenkov-lings"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.37", features = ["full"] }
notify = "6.1.1"
toml = "0.8.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
regex = "1.10"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2.0"
